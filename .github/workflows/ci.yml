name: CI

# BT-4: um unico workflow, matrix multi-OS (filosofia tab_pendencias).
# Gates hard: falha = job red. Sem continue-on-error nos gates obrigatorios.
# Sem `|| true` que transforme falha em verde.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push novo cancela a execucao velha do mesmo ramo; execucao de tag (release) nunca se cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ---------------------------------------------------------------------
  # Push so de docs pula os testes; segredos e privacidade rodam sempre.
  # Docs aqui: so o que nenhum teste nem portao le (TODO.md, .claude/**,
  # .md de evals/, docs/campanha, docs/auditoria, docs/submission e
  # docs/superpowers). docs/house e os .md da raiz que o drift e o sync
  # leem rodam o CI normal, como agents/ e skills/.
  # Base (L-35, "O seletivo"): o ultimo commit verde do proprio ramo; sem verde,
  # o ramo principal (push de outro ramo, ou PR); no principal sem verde, roda tudo.
  # Tag, workflow_dispatch ou base ilegivel: roda tudo.
  # ---------------------------------------------------------------------
  mudanca:
    name: mudanca so de docs?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      testes: ${{ steps.diff.outputs.testes }}
    steps:
      - name: Checkout (historico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Arquivos mudados contra a base
        id: diff
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RAMO: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DOCS='^(TODO\.md|\.claude/.*|evals/.+\.md|docs/(campanha|auditoria|submission|superpowers)/.*)$'
          testes=true
          base=""
          origem="roda tudo"
          # Ultimo SHA com run deste workflow fechado em success no ramo. Sem API ou
          # sem verde, sai vazio, e o pior caso e rodar tudo (nunca pular teste por falha).
          ultimo_verde() {
            local sha
            if sha="$(gh run list --workflow ci.yml --branch "$1" --status success --limit 1 --json headSha --jq '.[0].headSha // ""' 2>/dev/null)" \
               && [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
              printf '%s' "$sha"
            fi
          }
          if [ "$EVENTO" = "pull_request" ]; then
            base="$(ultimo_verde "$RAMO")"; origem="verde do proprio ramo"
            if [ -z "$base" ]; then base="$PR_BASE"; origem="ramo principal (PR)"; fi
          elif [ "$EVENTO" = "push" ] && [ "${REF#refs/tags/}" = "$REF" ]; then
            base="$(ultimo_verde "$RAMO")"; origem="verde do proprio ramo"
            if [ -z "$base" ] && [ "$RAMO" != "main" ]; then
              base="$(git rev-parse --verify -q origin/main)" || base=""
              origem="ramo principal"
            fi
          fi
          arquivos=""
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && arquivos="$(git diff --name-only "$base" HEAD)"; then
            if [ -n "$arquivos" ] && ! printf '%s\n' "$arquivos" | grep -vE "$DOCS" >/dev/null; then
              testes=false
            fi
          else
            base=""
          fi
          printf 'base: %s (%s)\n' "${base:-nenhuma}" "$origem"
          printf 'arquivos mudados:\n%s\n' "$arquivos"
          echo "roda os testes: $testes"
          echo "testes=$testes" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Job nativo: ubuntu + windows x Python 3.11 / 3.12
  # ---------------------------------------------------------------------
  test:
    name: validate (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: mudanca
    if: needs.mudanca.outputs.testes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: true (L-35, parar no primeiro erro): a primeira falha cancela o resto da matriz.
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # Shim do produto (bin/python3.cmd → py -3 / python). Windows runner
      # pode não ter o alias python3 no PATH; hooks.json documenta python3.
      - name: PATH com bin/python3.cmd (Windows)
        if: runner.os == 'Windows'
        run: echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Instalar dependencias de teste
        run: pip install -r requirements-dev.txt

      - name: pytest hooks/tests scripts/tests
        if: runner.os == 'Windows'
        run: python -m pytest hooks/tests scripts/tests -q

      - name: validate_plugin (ZERO-ORFAOS)
        if: runner.os == 'Windows'
        run: python scripts/validate_plugin.py

      # CONS-10: sem vault na CI, o gate sai com NAO CONFERIDO (aviso, nunca PASS).
      # So reprova divergencia ou erro de uso (gate_sync_house.py mapeia 0/1/2/3).
      - name: "sync docs/house (CONS-10, sem vault: 3 = nao conferido)"
        if: runner.os == 'Windows'
        run: python scripts/gate_sync_house.py --check

      - name: smoke_offline
        if: runner.os == 'Windows'
        run: python scripts/smoke_offline.py

      - name: check_semantic_drift (BT-7)
        if: runner.os == 'Windows'
        run: python scripts/check_semantic_drift.py

      - name: evals roteamento /bigtech (BT-8)
        if: runner.os == 'Windows'
        run: python evals/bigtech_routing/run_evals.py

      - name: JSON valido plugin.json
        if: runner.os == 'Windows'
        run: python -m json.tool .claude-plugin/plugin.json

      - name: JSON valido marketplace.json
        if: runner.os == 'Windows'
        run: python -m json.tool .claude-plugin/marketplace.json

      - name: JSON valido hooks.json
        if: runner.os == 'Windows'
        run: python -m json.tool hooks/hooks.json

      - name: Paridade de versao plugin.json == marketplace
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          plugin = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
          market = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          pv = plugin.get("version")
          mv = (market.get("plugins") or [{}])[0].get("version")
          if not pv or not mv or pv != mv:
              print(f"divergencia: plugin={pv!r} marketplace={mv!r}", file=sys.stderr)
              sys.exit(1)
          print(f"versao casada: {pv}")
          PY

      - name: ruff check hooks/ scripts/
        if: runner.os == 'Windows'
        run: ruff check hooks/ scripts/

      # Ubuntu: roda so o preci.sh, que tem os mesmos gates dos passos acima
      # (esses passos rodam so no Windows).
      - name: preci.sh (Ubuntu only)
        if: runner.os == 'Linux'
        run: bash scripts/preci.sh

  # ---------------------------------------------------------------------
  # Containers: Debian 12, Fedora 41, Arch (sobre ubuntu-latest), so na tag.
  # Digests e padrao install reutilizados do tab_pendencias CI-2.
  # ---------------------------------------------------------------------
  test-distros:
    name: validate (${{ matrix.distro }} via container)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - distro: debian
            image: "docker.io/library/debian:12-slim@sha256:63a496b5d3b99214b39f5ed70eb71a61e590a77979c79cbee4faf991f8c0783e"
            install: |
              apt-get update -qq
              apt-get install -y -qq python3 python3-venv git
          - distro: fedora
            image: "docker.io/library/fedora:41@sha256:68bb1ba893be0c05991b2df55bc6571862bab7526fd6053b1ebacd53a2a75366"
            install: |
              dnf install -y -q python3 git
          - distro: archlinux
            image: "docker.io/library/archlinux:latest@sha256:87465c3afdaede91333d4a9239d6a1ba7f47b2ec74b376e0070e81c25e7e3ff5"
            install: |
              pacman -Syu -q --noconfirm --needed python git
    steps:
      - name: "Instalar git + python3 (imagem minimalista)"
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "git safe.directory (checkout host UID + container root)"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Versao do Python neste ambiente"
        run: python3 --version

      - name: Instalar dependencias (venv em /tmp, PEP 668)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r requirements-dev.txt

      - name: PATH do venv
        run: echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: pytest hooks/tests scripts/tests
        run: /tmp/venv/bin/python -m pytest hooks/tests scripts/tests -q

      - name: validate_plugin (ZERO-ORFAOS)
        run: /tmp/venv/bin/python scripts/validate_plugin.py

      - name: smoke_offline
        run: /tmp/venv/bin/python scripts/smoke_offline.py

      - name: check_semantic_drift (BT-7)
        run: /tmp/venv/bin/python scripts/check_semantic_drift.py

      - name: evals roteamento /bigtech (BT-8)
        run: /tmp/venv/bin/python evals/bigtech_routing/run_evals.py

  # ---------------------------------------------------------------------
  # Privacidade (caminho local, termo pessoal, links): roda sempre,
  # inclusive em push so de docs.
  # ---------------------------------------------------------------------
  privacidade:
    name: privacidade (validate_plugin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: validate_plugin
        run: python scripts/validate_plugin.py

  # ---------------------------------------------------------------------
  # gitleaks: historico completo (hard gate), roda sempre
  # ---------------------------------------------------------------------
  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: gitleaks
        # gitleaks/gitleaks-action v3.0.0 (conta pessoal: GITLEAKS_LICENSE nao exigida)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
