<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ícone do plugin bigtech: constelação de nós ligados. Sem texto e sem marca de terceiros.
       Fundo sólido escuro dentro de um bloco arredondado: lê bem sobre claro e sobre escuro. -->
  <rect x="6" y="6" width="500" height="500" rx="108" ry="108" fill="#1B2437" stroke="#8A97B0" stroke-width="12"/>
  <g stroke="#F5F7FA" stroke-width="20" stroke-linecap="round" fill="none">
    <line x1="256" y1="256" x2="120" y2="150"/>
    <line x1="256" y1="256" x2="400" y2="120"/>
    <line x1="256" y1="256" x2="410" y2="330"/>
    <line x1="256" y1="256" x2="150" y2="380"/>
    <line x1="120" y1="150" x2="400" y2="120"/>
    <line x1="400" y1="120" x2="410" y2="330"/>
    <line x1="150" y1="380" x2="410" y2="330"/>
  </g>
  <g fill="#F5F7FA">
    <circle cx="120" cy="150" r="36"/>
    <circle cx="400" cy="120" r="36"/>
    <circle cx="410" cy="330" r="36"/>
    <circle cx="150" cy="380" r="36"/>
  </g>
  <circle cx="256" cy="256" r="60" fill="#F2A93B"/>
</svg>
